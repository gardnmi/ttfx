name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:      
  test:
    name: Tests + parity suite
    # Parity CI is pinned to one platform/toolchain pair (plan.md §5.20):
    # cross-platform builds are release targets, not parity targets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./bin/test

  fx-simd:
    name: FX SIMD oracle (${{ matrix.kernel }}, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kernel: [widest, no-avx512, no-avx2]
        shard: [1, 2, 3]
    env:
      JOBS: "2"
      ORACLE_SHARD: "${{ matrix.shard }}/3"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/tests/fx_oracle_harness.py
      - run: cargo build --release --locked
      # The widest kernel depends on the runner's CPU; AVX-512 is not required.
      - run: tools/fx/oracle-simd.sh quick "${{ matrix.kernel }}"

  fx-qemu:
    name: FX oracle (qemu64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y qemu-user
      - run: cargo build --release --locked
      - run: tools/fx/qemu-oracle.sh qemu64

  test-macos:
    name: Tests (macOS)
    # bin/test skips the parity suites off Linux, so what's left here proves the
    # port builds, tests green (with the boundary-tolerant easing assertion for
    # Apple's libm), and honors the CLI and signal contracts on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./bin/test
      - uses: actions/upload-artifact@v4
        with:
          name: ttfx-aarch64-apple-darwin
          path: target/release/ttfx

  release-binary:
    name: Static musl binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: ttfx-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/ttfx

  build-nix:
    name: Nix Build (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
      - name: Building nix package
        run: nix build
